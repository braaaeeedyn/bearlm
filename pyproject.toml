[project]
name = "bearlm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Braedyn Thompson", email = "braaaeeedyn@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.5",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.10.0",
    "pdfplumber>=0.11.10",
    "pymongo[srv]>=4.18.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "ragas>=0.3.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "tiktoken>=0.14.0",
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.4",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[project.scripts]
bearlm = "bearlm:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
